name: Deploy to DigitalOcean VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            set -e

            cd /var/www/Emedix-Jiffy-Backend
            
            git fetch origin
            git reset --hard origin/master
            
            npm install
            npm run build

            docker start emedix_jiffy_redis || docker run -d --name emedix_jiffy_redis -p 127.0.0.1:6379:6379 -v redis_data:/data --restart unless-stopped redis:7-alpine redis-server --appendonly yes

            npm run migration:run
            
            pm2 restart jiffyBack
