### Production
services:
  redis:
    image: redis:7-alpine
    container_name: emedix_jiffy_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
